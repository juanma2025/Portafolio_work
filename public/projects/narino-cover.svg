<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" rx="32" fill="#F5F5F7"/>
  <rect x="60" y="56" width="1080" height="638" rx="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/>
  <!-- Top editorial bar -->
  <rect x="110" y="106" width="180" height="28" rx="14" fill="#F2F2F7"/>
  <text x="132" y="125" fill="#1D1D1F" font-family="sans-serif" font-size="12" font-weight="600">CORPOCARNAVAL · NARIÑO</text>
  <text x="110" y="196" fill="#1D1D1F" font-family="sans-serif" font-size="42" font-weight="700">Patrimonio vivo del Carnaval de Negros y Blancos</text>
  <text x="110" y="236" fill="#6E6E73" font-family="sans-serif" font-size="18">Exploración cultural, agenda oficial, modalidades y memoria colectiva de Nariño.</text>
  <!-- 3 Cultural feature cards -->
  <rect x="110" y="286" width="310" height="340" rx="22" fill="#FAFAFC" stroke="#E5E5EA"/>
  <rect x="134" y="310" width="262" height="160" rx="14" fill="#E8F0FE"/>
  <text x="134" y="510" fill="#86868B" font-family="sans-serif" font-size="12" font-weight="600">MODALIDADES ARTÍSTICAS</text>
  <text x="134" y="540" fill="#1D1D1F" font-family="sans-serif" font-size="20" font-weight="700">Carrozas, murgas y disfraces</text>
  <text x="134" y="572" fill="#6E6E73" font-family="sans-serif" font-size="14">Historia de maestros artesanos y talleres.</text>

  <rect x="445" y="286" width="310" height="340" rx="22" fill="#FAFAFC" stroke="#E5E5EA"/>
  <rect x="469" y="310" width="262" height="160" rx="14" fill="#F2F2F7"/>
  <text x="469" y="510" fill="#86868B" font-family="sans-serif" font-size="12" font-weight="600">PROGRAMACIÓN INTERACTIVA</text>
  <text x="469" y="540" fill="#1D1D1F" font-family="sans-serif" font-size="20" font-weight="700">Sendas y rutas del Carnaval</text>
  <text x="469" y="572" fill="#6E6E73" font-family="sans-serif" font-size="14">Consulta horarios, mapas y eventos en vivo.</text>

  <rect x="780" y="286" width="310" height="340" rx="22" fill="#FAFAFC" stroke="#E5E5EA"/>
  <rect x="804" y="310" width="262" height="160" rx="14" fill="#E8F0FE"/>
  <text x="804" y="510" fill="#86868B" font-family="sans-serif" font-size="12" font-weight="600">ARCHIVO CULTURAL</text>
  <text x="804" y="540" fill="#1D1D1F" font-family="sans-serif" font-size="20" font-weight="700">Relatos e identidad nariñense</text>
  <text x="804" y="572" fill="#6E6E73" font-family="sans-serif" font-size="14">Validado con 7 usuarios y Corpocarnaval.</text>
